# Preferred install path on Windows.
#   conda env create -f environment.yml
#   conda activate geospatial-research
#
# conda-forge is required (not defaults) — it carries the GDAL/GEOS/PROJ builds
# that geopandas, rasterio and cartopy link against.

name: geospatial-research

channels:
  - conda-forge

dependencies:
  - python=3.11

  # ---- Core ----
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11

  # ---- Geospatial stack (pull these from conda, never pip) ----
  - gdal
  - geos
  - proj
  - geopandas>=0.14
  - pyogrio>=0.7
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.6
  - rtree>=1.1
  - rasterio>=1.3
  - cartopy>=0.22

  # ---- Distance ----
  - geopy>=2.4

  # ---- Spatial statistics (PySAL family) ----
  - libpysal>=4.9
  - esda>=2.5
  - spreg>=1.4
  - splot>=1.1
  - mapclassify>=2.6

  # ---- Modelling ----
  - scikit-learn>=1.3
  - statsmodels>=0.14

  # ---- Bayesian ----
  - pymc>=5.10
  - arviz>=0.17
  - pytorch>=2.1

  # ---- Plotting ----
  - matplotlib>=3.8
  - contextily>=1.5
  - folium>=0.15

  # ---- Notebooks / utils ----
  - jupyterlab>=4.0
  - tabulate>=0.9
  - tqdm>=4.66

  # ---- LaTeX build for report/main.tex ----
  # Not included: install TeX Live or MiKTeX separately for `make report`.

  - pip
  - pip:
      - gpytorch>=1.11
